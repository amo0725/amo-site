name: Production check

# After every production deploy, run the smoke test against the live site.
# CI tests a fresh build of the commit; this tests what Vercel actually
# shipped (its build can differ, e.g. with a restored build cache).
# A pull request that changes this workflow also runs it, against the
# live site as it is, so a change to the check is tried before it lands.
on:
  deployment_status:
  pull_request:
    paths:
      - .github/workflows/production-check.yml

jobs:
  live:
    name: Smoke test the live site
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    # Same pin as CI: the smoke test's browser setup is known good on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test (https://amo-site.vercel.app, desktop and phone, both languages)
        env:
          BASE_URL: https://amo-site.vercel.app
          EXPECT_COMMIT: ${{ github.event.deployment.sha }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee smoke.log

      # Failed checks as annotations, so they show on the commit and the
      # pull request without opening the log.
      - name: Report what failed
        if: failure()
        run: |
          grep -E '^FAIL' smoke.log | head -n 10 | while IFS= read -r line; do
            echo "::error title=Live site::${line#FAIL }"
          done
          if ! grep -qE 'check\(s\) failed|All smoke checks passed' smoke.log; then
            tail -n 20 smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::error title=Smoke test crashed::/'
          fi
