name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, smoke test
    # Pinned: ubuntu-latest started moving to Ubuntu 26 on 2026-10-19, and the
    # smoke test's browser setup is only known good on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://amo-site.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Browser for the smoke test
        run: /usr/bin/google-chrome --version

      - name: Smoke test (production server, desktop and phone, both languages)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm start -- -p 3100 &
          npm run smoke
